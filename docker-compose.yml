version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agrikural_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: agrikural
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agrikural_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/agrikural
      - CHROMA_PATH=/app/data/chroma_db
      - JWT_SECRET=agrikural-docker-secret-2026
      - STT_PROVIDER=local
      - TRANSLATION_PROVIDER=local
      - TTS_PROVIDER=gtts
      - LLM_PROVIDER=local
    volumes:
      - ./data:/app/data
      - ./knowledge_docs:/app/knowledge_docs
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agrikural_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
